<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Compras">
  <meta name="format-detection" content="telephone=no">
  <title>Compras</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar" id="topbar">
    <div class="topbar-inner">
      <span class="topbar-title" aria-hidden="true">Compras</span>
      <button class="icon-btn" id="menuBtn" aria-label="Más opciones">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      </button>
    </div>
  </header>

  <main id="main">
    <header class="hero">
      <p class="date" id="today"></p>
      <h1 class="title" id="title">Compras</h1>
      <div class="summary" id="summary">
        <div class="ring" aria-hidden="true">
          <svg viewBox="0 0 44 44"><circle class="ring-track" cx="22" cy="22" r="19"/><circle class="ring-fill" id="ringFill" cx="22" cy="22" r="19"/></svg>
          <span class="ring-pct" id="ringPct">0%</span>
        </div>
        <div class="summary-text">
          <strong id="progressText"></strong>
          <span id="progressSub"></span>
        </div>
      </div>
    </header>

    <ul class="list" id="pendingList"></ul>
    <div class="empty" id="empty" hidden></div>

    <section id="tasksSection" hidden>
      <h2 class="section-title">Otras tareas</h2>
      <ul class="list" id="taskList"></ul>
    </section>

    <section id="doneSection" hidden>
      <div class="section-head">
        <h2 class="section-title">Comprado <span id="doneCount"></span></h2>
        <button class="text-btn" id="clearDoneBtn">Limpiar</button>
      </div>
      <ul class="list" id="doneList"></ul>
    </section>
  </main>

  <div class="composer" id="composer">
    <div class="suggestions" id="suggestions"></div>
    <form class="composer-row" id="addForm" autocomplete="off">
      <button type="button" class="round-btn" id="favBtn" aria-label="Habituales">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg>
      </button>
      <input id="addInput" type="text" placeholder="Añadir producto" maxlength="80"
             enterkeyhint="enter" autocapitalize="sentences" autocorrect="on" spellcheck="false" aria-label="Nombre del producto">
      <button type="submit" class="add-btn" id="addBtn" aria-label="Añadir">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </form>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <span id="toastText"></span>
    <button id="toastUndo">Deshacer</button>
  </div>

  <div class="sheet-layer" id="sheetLayer" hidden>
    <div class="backdrop" id="backdrop"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
